version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scrimba_db
    environment:
      POSTGRES_USER: scrimba
      POSTGRES_PASSWORD: scrimba_password
      POSTGRES_DB: scrimba_clone
    ports:
      - "5432:5432"
    volumes:
      - scrimba_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: scrimba_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - scrimba_miniodata:/data
    restart: unless-stopped

volumes:
  scrimba_pgdata:
  scrimba_miniodata:

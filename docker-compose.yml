version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scrimba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:password@db:5432/scrimba?schema=public
      - JWT_SECRET=supersecret123
      # You can pass your AWS credentials via a local .env file or export them in your shell
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-my-scrimba-bucket}
    ports:
      - "4000:4000"
    depends_on:
      - db
    # Run prisma db push to ensure the schema exists, then start the server
    command: >
      sh -c "bunx prisma db push && bun run src/index.ts"

volumes:
  postgres_data:

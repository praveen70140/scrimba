version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scrimba_db
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scrimba_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: scrimba_minio
    env_file:
      - .env.docker
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - scrimba_miniodata:/data
    restart: unless-stopped

volumes:
  scrimba_pgdata:
  scrimba_miniodata:

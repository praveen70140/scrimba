version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: scrimba_db
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - scrimba_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: scrimba_rustfs
    env_file:
      - .env.docker
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - scrimba_rustfsdata:/data
    restart: unless-stopped

volumes:
  scrimba_pgdata:
  scrimba_rustfsdata:
